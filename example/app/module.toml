# required!
type = "application"
# default: directory name
name = "app"

[artifact]
# default: inherited from project
group = "dev.scriptor.example"
# default: module name
name = "app"
# default: inherited from project
version = "1.0.0"

# dependencies always inherited from project
[dependencies]
# module dependencies
modules = ["lib"]
# maven dependencies
maven = ["org.jetbrains.kotlin:kotlin-stdlib:2.4.20"]

[sources.main]

[application]
# required!
main = "dev.scriptor.example.app.MainKt"
include = ["main"]
